# dsh-preset-studio bundle patch: inserts the Preset Studio plugin row into
# the web profile roster. Applied as a profile bundle layer (the
# `dsh.bundle.patch` manifest field); activate with
# `dsh plugin --profile web add link:$(pwd)` from this package root.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (settings namespace + system-prompt announcement), and
# the `dsh.client` declaration in package.json makes the browser half
# (exports "./client", served at /plugins/<id>/client.js) load in the web GUI.
- insert:
    - id: ui-preset-studio
      name: '@WeiLinCool/dsh-preset-studio'
